<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nissy optimal — streamed tables</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:840px;margin:1.5rem auto;padding:0 1rem}
  h1{font-size:1.2rem} .sub{color:#888;font-size:.85rem;margin-bottom:1rem}
  input{font:inherit;padding:.35rem .5rem;width:22rem}
  button{font:inherit;padding:.4rem .8rem;margin-left:.4rem;cursor:pointer}
  #status{font-size:.85rem;padding:.5rem .6rem;border-radius:6px;background:rgba(127,127,127,.12);margin:.6rem 0}
  pre{background:#111;color:#eaeaea;padding:.75rem;border-radius:8px;min-height:6rem;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
  pre .s{color:#7fd1ff} pre .e{color:#ff9a9a}
  #streamed{font-size:.8rem;color:#888;margin-top:.4rem}
</style></head>
<body>
  <h1>Nissy &mdash; optimal solve with streamed tables</h1>
  <div class="sub">Streams <code>pt_nxopt31_HTM</code> (2.3&nbsp;GB) + support tables from <code>/dist-tables</code> straight into the wasm heap (one copy) via <code>Range</code> requests, then solves.</div>
  <div>
    <label>Scramble <input id="scramble" value="R U F"></label>
    <button id="runOptimal" disabled>Solve optimal</button>
    <button id="clear">Clear</button>
  </div>
  <div id="status">Starting engine&hellip;</div>
  <div id="streamed"></div>
  <pre id="out"></pre>
  <script src="app.js" defer></script>
</body></html>
